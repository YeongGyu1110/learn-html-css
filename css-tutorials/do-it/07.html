<!-- 텍스트를 표현하는 다양한 스타일 -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bungee&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap');

        div {
            box-sizing: border-box;
            margin-bottom: 50px;
            border: 2px black solid;
        }

        p {
            margin: 0;
            font-size: 48px;
        }



        #malgeun-godig {
            font-family: "맑은 고딕";
        }

        #dod-um {
            font-family: 돋움;
        }

        #gullim {
            font-family: 굴림;
        }



        #font-size-16px {
            font-size: 16px;
        }

        #font-size-32px {
            font-size: 32px;
        }

        #font-size-2rem {
            font-size: 2rem;
        }



        #font-style-normal {
            font-style: normal;
        }

        #font-style-italic {
            font-style: italic;
        }

        #font-style-oblique {
            font-style: oblique;
        }



        #font-weight-100 {
            font-weight: 100;
        }

        #font-weight-400 {
            font-weight: 400;
            /* font-weight: normal; */
        }

        #font-weight-700 {
            font-weight: 700;
            /* font-weight: bold; */
        }

        #font-weight-900 {
            font-weight: 900;
        }


        #bungee-regular {
            font-family: "Bungee", sans-serif;
            font-weight: 400;
            font-style: normal;
        }


        #indie-flower-regular {
            font-family: "Indie Flower", cursive;
            font-weight: 400;
            font-style: normal;
        }
    </style>
</head>

<body>
    <div>
        <p id="malgeun-godig">맑은 고딕체</p>
        <p id="dod-um">돋움체</p>
        <p id="gullim">굴림체</p>
    </div>

    <div>
        <p id="font-size-16px">font size 16px임.</p>
        <p id="font-size-32px">font size 32px임.</p>
        <p id="font-size-2rem">font size 2rem임.</p>
    </div>

    <div>
        <p id="font-style-normal">font style normal</p>
        <p id="font-style-italic">font style italic (기울어진 폰트 사용)</p>
        <p id="font-style-oblique">font style oplique (글자 기울기)</p>
    </div>

    <div>
        <p id="font-weight-100">font weight 100</p>
        <p id="font-weight-400">font weight 400</p>
        <p id="font-weight-700">font weight 700</p>
        <p id="font-weight-900">font weight 900</p>
    </div>

    <div>
        <p id="bungee-regular">Whereas disregard and contempt for</p>
        <p id="indie-flower-regular">Whereas disregard and contempt for</p>
    </div>
</body>

</html>
